<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <title>智流商城管理后台</title>
    <meta name="description" content="智流商城（ZhiFlow）管理后台" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/platform-config.js"></script>
    <script>
      window.process = {};
    </script>
  </head>

  <body>
    <div id="app">
      <style>
        @keyframes app-loader-spin {
          to {
            transform: rotate(360deg);
          }
        }

        html,
        body,
        #app {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }

        .app-loader {
          width: 40px;
          height: 40px;
          border: 4px solid #dbe4fb;
          border-top-color: #2456f5;
          border-radius: 50%;
          animation: app-loader-spin 0.9s infinite linear;
        }

        @media (prefers-reduced-motion: reduce) {
          .app-loader {
            animation: none;
          }
        }
      </style>
      <div class="app-loader" role="img" aria-label="加载中"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
